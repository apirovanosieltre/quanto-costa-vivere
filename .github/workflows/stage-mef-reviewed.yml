name: Stage reviewed MEF municipal dataset
on:
  push:
    branches:
      - feature/local-tax-2026-reviewed
    paths:
      - 'scripts/mef-reviewed-2026.json'
      - 'scripts/mef-csv.mjs'
      - 'scripts/sync-mef.mjs'
      - '.github/workflows/stage-mef-reviewed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-reviewed-mef-2026
  cancel-in-progress: true

jobs:
  stage:
    if: github.repository == 'apirovanosieltre/quanto-costa-vivere' && github.ref == 'refs/heads/feature/local-tax-2026-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test schema and exemptions
        run: node --test scripts/mef-csv.test.mjs
      - name: Acquire original and validate immutable reviewed SHA256 and samples
        run: node scripts/sync-mef.mjs --publish --reviewed --manifest scripts/mef-reviewed-2026.json
      - name: Verify generated publication
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('public/data/municipal-2026.json'));
          const manifest=JSON.parse(fs.readFileSync('scripts/mef-reviewed-2026.json'));
          if(!d.published || d.report.simple!==manifest.expectedCounts.simple ||
             d.report.rows!==manifest.expectedRows ||
             d.review?.sourceSha256!==manifest.sourceSha256) process.exit(1);
          console.log('QA approved, simple rates:',d.report.simple,'pending:',d.report.pending,'SHA256:',d.review.sourceSha256);
          NODE
      - name: Commit candidate into feature PR branch (never deploy directly from this workflow)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/municipal-2026.json
          if git diff --cached --quiet; then echo 'Dataset unchanged'; exit 0; fi
          git commit -m 'data(mef): stage audited municipal 2026 CSV for review'
          git push origin HEAD:refs/heads/feature/local-tax-2026-reviewed
