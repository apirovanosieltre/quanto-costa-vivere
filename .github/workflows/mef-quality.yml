name: MEF 2026 - controllo dataset
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/mef-quality.yml'
  workflow_dispatch:
  schedule:
    # Ogni lunedi, 06:15 UTC. Controllo senza pubblicazione automatica.
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test parser MEF
        run: node --test scripts/mef-csv.test.mjs
      - name: Scarica e verifica CSV ufficiale
        run: node scripts/sync-mef.mjs
      - name: Audit CSV comunale 2026\n        run: node scripts/audit-mef-2026.mjs\n      - name: Ispeziona tracciato ufficiale addizionali regionali 2026
        run: node scripts/inspect-mef-regional.mjs
      - name: Salva report QA e JSON candidato (non pubblicato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mef-report
          path: |
            mef-validation-report.json
            mef-candidate-2026.json
            mef-regional-report.json
          if-no-files-found: ignore
